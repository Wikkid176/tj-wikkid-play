name: Publish playable browser game
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.deploy/ready.json', '.github/workflows/pages.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: public-game-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable Pages for this public game repository
        id: enable
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          def api(method,body=None):
              args=['gh','api','--method',method,f'repos/{repo}/pages']
              if body is not None:args+=['--input','-']
              return subprocess.run(args,input=json.dumps(body) if body is not None else None,text=True,capture_output=True)
          r=api('GET')
          if r.returncode:r=api('POST',{'build_type':'workflow'})
          elif json.loads(r.stdout).get('build_type')!='workflow':r=api('PUT',{'build_type':'workflow'})
          result={'success':r.returncode==0,'response':r.stdout[:4000] if not r.returncode else r.stderr[:4000]}
          open('pages-enablement.json','w').write(json.dumps(result))
          if r.returncode:raise SystemExit(r.stderr)
          PY
      - name: Configure Pages
        id: configure
        if: steps.enable.outcome == 'success' && hashFiles('.deploy/ready.json') != ''
        uses: actions/configure-pages@v5
      - name: Upload complete browser site
        id: artifact
        if: steps.configure.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          retention-days: 1
      - name: Deploy public browser game
        id: deployment
        if: steps.artifact.outcome == 'success'
        uses: actions/deploy-pages@v4
      - name: Check the public game page
        id: check
        if: steps.deployment.outcome == 'success'
        env:
          GAME_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os,urllib.request,json,hashlib
          from pathlib import Path
          base=os.environ['GAME_URL'].rstrip('/')+'/'
          checked={}
          for path in ('index.html','play/index.html','play/game.wasm','play/assets.json','social-preview-v2.3.jpg'):
              with urllib.request.urlopen(base+path,timeout=60) as r:
                  data=r.read();assert r.status==200
              assert hashlib.sha256(data).hexdigest()==hashlib.sha256(Path(path).read_bytes()).hexdigest(),path
              checked[path]={'http':200,'sha256':hashlib.sha256(data).hexdigest()}
          Path('pages-health.json').write_text(json.dumps({'live_url':base,'checked':checked},indent=2))
          PY
      - name: Record deployment status over Git
        if: always()
        env:
          ENABLE: ${{ steps.enable.outcome }}
          DEPLOY: ${{ steps.deployment.outcome }}
          CHECK: ${{ steps.check.outcome }}
          GAME_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os,json,subprocess,tempfile
          from pathlib import Path
          r={'source_commit':os.environ['GITHUB_SHA'],'run_url':os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],'enable':os.environ['ENABLE'],'deploy':os.environ['DEPLOY'],'health_check':os.environ['CHECK'],'url':os.environ['GAME_URL']}
          for name in ('pages-enablement.json','pages-health.json'):
              if Path(name).exists():r[name]=json.loads(Path(name).read_text())
          p=Path(tempfile.mkdtemp());subprocess.run(['git','init','-b','deployment-status',str(p)],check=True)
          (p/'pages.json').write_text(json.dumps(r,indent=2)+'\n')
          for k,v in [('user.name','github-actions[bot]'),('user.email','41898282+github-actions[bot]@users.noreply.github.com')]:subprocess.run(['git','-C',str(p),'config',k,v],check=True)
          subprocess.run(['git','-C',str(p),'add','.'],check=True);subprocess.run(['git','-C',str(p),'commit','-m','Record browser deployment status'],check=True)
          # Use checkout's scoped credential helper; no token is printed or committed.
          ref='refs/heads/deployment-status'
          current=subprocess.check_output(['git','ls-remote','origin',ref],text=True).strip();expected=current.split()[0] if current else ''
          env=os.environ.copy();env['GIT_INDEX_FILE']=str(p/'status.index')
          subprocess.run(['git','read-tree','--empty'],env=env,check=True)
          subprocess.run(['git','--work-tree='+str(p),'add','pages.json'],env=env,check=True)
          tree=subprocess.check_output(['git','write-tree'],env=env,text=True).strip()
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True);subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          commit=subprocess.check_output(['git','commit-tree',tree,'-m','Record browser deployment status'],text=True).strip()
          subprocess.run(['git','push','--force-with-lease='+ref+':'+expected,'origin',commit+':'+ref],check=True)
          PY
